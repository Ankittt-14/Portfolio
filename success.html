<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent — Ankit Raj</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@300;400;500;700;800&display=swap"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23080808'/><rect width='64' height='64' rx='14' fill='none' stroke='%23c8f04a' stroke-width='2.5'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial Black, sans-serif' font-weight='900' font-size='28' fill='%23c8f04a' letter-spacing='-1.5'>AR</text></svg>">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg);
      text-align: center;
      padding: 2rem;
    }

    .success-container {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 4rem 3rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .success-icon {
      color: var(--accent);
      margin-bottom: 2rem;
      display: inline-block;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    h1 {
      font-family: 'Clash Display', sans-serif;
      font-size: 2.5rem;
      color: var(--text);
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    p {
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      background: var(--text);
      color: #000;
      padding: 1rem 2rem;
      border-radius: 12px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-home:hover {
      background: var(--accent);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="cur" id="cur"></div>
  <div class="cur-trail" id="trail"></div>

  <div class="success-container">
    <div class="success-icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>
    <h1>Message Sent!</h1>
    <p>Thanks for reaching out! I've received your message and will get back to you as soon as possible.</p>
    <a href="index.html" class="btn-home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to Portfolio
    </a>
  </div>

  <script src="script.js"></script>
</body>

</html>
