<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent — Ankit Raj</title>
  <meta name="robots" content="noindex">

  <!-- Same fonts as main site -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23080808'/><rect width='64' height='64' rx='14' fill='none' stroke='%23c8f04a' stroke-width='2.5'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial Black, sans-serif' font-weight='900' font-size='28' fill='%23c8f04a' letter-spacing='-1.5'>AR</text></svg>">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg);
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      width: 60vw;
      height: 60vw;
      background: var(--accent);
      filter: blur(180px);
      opacity: 0.06;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .success-container {
      background: rgba(15, 15, 15, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 28px;
      padding: 5rem 4rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(24px);
      position: relative;
      overflow: hidden;
      animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Accent top border */
    .success-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .success-icon {
      color: var(--accent);
      margin-bottom: 2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: rgba(200, 240, 74, 0.1);
      border: 1px solid rgba(200, 240, 74, 0.25);
      animation: popIn 0.5s 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 1rem;
      line-height: 1.15;
      letter-spacing: -0.03em;
      animation: fadeUp 0.5s 0.3s both;
    }

    p {
      color: var(--muted);
      font-family: 'Manrope', sans-serif;
      font-size: 1rem;
      line-height: 1.75;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.5s 0.4s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      background: var(--accent);
      color: #000;
      padding: 1rem 2.2rem;
      border-radius: 12px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s ease;
      animation: fadeUp 0.5s 0.5s both;
    }

    .btn-home:hover {
      background: var(--text);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(200, 240, 74, 0.2);
    }

    /* Confetti dots (decorative) */
    .confetti {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      animation: confettiFall var(--dur) var(--delay) ease-in forwards;
    }

    @keyframes confettiFall {
      0%   { opacity: 0.8; transform: translateY(-20px) rotate(0deg) scale(1); }
      100% { opacity: 0;   transform: translateY(120px) rotate(360deg) scale(0.4); }
    }
  </style>
</head>

<body>
  <div class="cur" id="cur"></div>
  <div class="cur-trail" id="trail"></div>

  <div class="success-container" id="successBox">
    <div class="success-icon">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Message Sent!</h1>
    <p>Thanks for reaching out, I've received your message and will get back to you as soon as possible. Looking forward to connecting!</p>
    <a href="index.html" class="btn-home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to Portfolio
    </a>
  </div>

  <script>
    // Cursor (minimal, no form logic)
    const cur   = document.getElementById('cur');
    const trail = document.getElementById('trail');
    document.addEventListener('mousemove', e => {
      cur.style.left   = e.clientX + 'px';
      cur.style.top    = e.clientY + 'px';
      trail.style.left = e.clientX + 'px';
      trail.style.top  = e.clientY + 'px';
    });

    // Confetti burst on load
    const box = document.getElementById('successBox');
    for (let i = 0; i < 16; i++) {
      const dot = document.createElement('div');
      dot.className = 'confetti';
      dot.style.setProperty('--dur',   (0.8 + Math.random() * 0.8) + 's');
      dot.style.setProperty('--delay', (Math.random() * 0.5) + 's');
      dot.style.left   = (Math.random() * 100) + '%';
      dot.style.top    = '10%';
      dot.style.background = Math.random() > 0.5 ? '#c8f04a' : '#e8e6e1';
      dot.style.width  = dot.style.height = (4 + Math.random() * 6) + 'px';
      box.appendChild(dot);
    }
  </script>
</body>

</html>
